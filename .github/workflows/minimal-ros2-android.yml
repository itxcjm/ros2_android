name: Build minimal ROS 2 Android runtime

on:
  push:
    branches: [codex/minimal-ros2-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out public ROS Android base
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Configure public GitHub submodule URL
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK toolchain
        id: android-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/25.1.8937393
            /usr/local/lib/android/sdk/build-tools/33.0.0
            /usr/local/lib/android/sdk/platforms/android-30
          key: android-sdk-linux-ndk25.1-api30-buildtools33-v1

      - name: Install Android SDK packages
        if: steps.android-cache.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;33.0.0" "ndk;25.1.8937393"

      - name: Set Android SDK root
        run: echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install ROS build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip make cmake ninja-build build-essential zip python3-dev python3-pip python3-catkin-pkg python3-empy python3-lark
          python3 -m pip install --user --break-system-packages vcstool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias adb_debug_key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache ROS 2 source dependencies
        id: ros-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ros2-humble-sources-${{ hashFiles('ros.repos') }}

      - name: Fetch public ROS 2 Humble dependencies
        if: steps.ros-cache.outputs.cache-hit != 'true'
        run: vcs import --input ros.repos deps/

      - name: Cross-compile runtime and reference APK
        run: |
          cmake -S . -B build -DANDROID_HOME="$ANDROID_HOME" -DPATH_TO_KEYSTORE="$HOME/.android/debug.keystore"
          cmake --build build --parallel 2

      - name: Upload native libraries and reference APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-humble-android-arm64
          path: |
            build/lib/arm64-v8a/*.so
            build/sensors_for_ros.apk
          retention-days: 7
