name: Build ROS 2 Android arm64

on:
  push:
    branches: [codex/android-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install ROS build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip make cmake ninja-build build-essential python3-dev python3-pip python3-venv python3-catkin-pkg python3-empy python3-lark
          python3 -m pip install --user --break-system-packages vcstool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias adb_debug_key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Fetch pinned ROS 2 sources
        run: make deps

      - name: Cross-compile ROS 2 for arm64 Android
        run: make native

      - name: Build reference APK
        run: make app

      - name: Upload APK and native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-android-arm64
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/jniLibs/arm64-v8a/
          retention-days: 7
